name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile skills/yandex-direct/scripts/yandex_direct_toolkit.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke test examples
        run: |
          python skills/yandex-direct/scripts/yandex_direct_toolkit.py validate-package examples/campaign-package.example.json
          python skills/yandex-direct/scripts/yandex_direct_toolkit.py build-responsive-payload examples/campaign-package.example.json
